name: Publish NPM Packages

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  npm-publish:
    name: Publish @agentlanejs/process-bridge to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
    defaults:
      run:
        working-directory: packages/process_bridge_ts

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set up npm with trusted publishing support
        run: npm install --global "npm@^11.5.1"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify package version matches release tag
        run: |
          package_version="$(node -p "require('./package.json').version")"
          release_version="${GITHUB_REF_NAME#v}"

          if [ "${package_version}" != "${release_version}" ]; then
            echo "package.json version ${package_version} does not match release tag ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Check package
        run: bun run check

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish package
        run: npm publish --provenance --access public

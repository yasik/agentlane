name: Publish NPM Packages

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.12.0.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  npm-publish:
    name: Publish @agentlanejs/process-bridge to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    defaults:
      run:
        working-directory: packages/process_bridge_ts

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set up npm with trusted publishing support
        run: npm install --global "npm@^11.5.1"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify package version matches release tag
        run: |
          package_version="$(node -p "require('./package.json').version")"
          release_version="${RELEASE_TAG#v}"

          if [ "${package_version}" != "${release_version}" ]; then
            echo "package.json version ${package_version} does not match release tag ${RELEASE_TAG}."
            exit 1
          fi

      - name: Check package
        run: bun run check

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish package
        run: npm publish --provenance --access public
